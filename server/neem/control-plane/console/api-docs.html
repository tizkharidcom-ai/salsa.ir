<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NEEM API Contracts</title>
  <style>
    :root { color-scheme: dark; font-family: Vazirmatn, Tahoma, sans-serif; }
    body { margin: 0; background: #0b1220; color: #e5edf8; }
    main { max-width: 1180px; margin: 0 auto; padding: 28px 20px 56px; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { color: #aab8ca; }
    .toolbar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin: 22px 0; }
    input, select, button { border: 1px solid #33445d; border-radius: 8px; background: #111d31; color: #e5edf8; padding: 10px 12px; font: inherit; }
    input { min-width: 280px; flex: 1; }
    button { cursor: pointer; }
    button:hover { border-color: #75a9ff; }
    #status { padding: 10px 12px; border-radius: 8px; background: #13233a; color: #a9c9ff; }
    #status.error { background: #3a1820; color: #ffb6bd; }
    #summary { margin: 14px 0; color: #c5d2e4; }
    table { width: 100%; border-collapse: collapse; background: #0f1a2c; border: 1px solid #263853; }
    th, td { text-align: right; vertical-align: top; border-bottom: 1px solid #263853; padding: 11px 12px; }
    th { color: #a9c9ff; background: #14243a; position: sticky; top: 0; }
    code { direction: ltr; unicode-bidi: plaintext; color: #d4e3ff; }
    .method { font-weight: 700; color: #8fd5b0; }
    .muted { color: #8fa1b8; }
    @media (max-width: 720px) {
      main { padding: 20px 12px 40px; }
      input { min-width: 0; width: 100%; }
      table { font-size: 13px; }
      th, td { padding: 8px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>قراردادهای API کنترل‌پلین NEEM</h1>
    <p>این صفحه فقط metadata قرارداد را از endpoint احراز‌شده می‌خواند. وضعیت <code>inventory_derived</code> به معنی آمادگی تولیدی نیست.</p>
    <div class="toolbar" aria-label="فیلتر قراردادها">
      <label for="search">جست‌وجو</label>
      <input id="search" type="search" autocomplete="off" placeholder="مسیر، operationId یا capability">
      <label for="surface">سطح</label>
      <select id="surface">
        <option value="">همه</option>
        <option value="data-plane">data-plane</option>
        <option value="control-plane">control-plane</option>
      </select>
      <button id="reload" type="button">بارگذاری دوباره</button>
    </div>
    <div id="status" role="status" aria-live="polite">در حال بارگذاری قرارداد…</div>
    <div id="summary" class="muted"></div>
    <table>
      <caption class="muted">فهرست عملیات قرارداد API</caption>
      <thead>
        <tr><th scope="col">روش</th><th scope="col">مسیر</th><th scope="col">شناسه عملیات</th><th scope="col">سطح / وضعیت</th></tr>
      </thead>
      <tbody id="operations"></tbody>
    </table>
  </main>
  <script>
    (() => {
      const state = { operations: [], document: null };
      const $ = (id) => document.getElementById(id);
      const status = (message, isError = false) => {
        $('status').textContent = message;
        $('status').classList.toggle('error', isError);
      };
      const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
      const render = () => {
        const query = $('search').value.trim().toLowerCase();
        const surface = $('surface').value;
        const rows = state.operations.filter((op) => {
          if (surface && op.surface !== surface) return false;
          return !query || [op.method, op.path, op.operationId, op.capability, op.permission].join(' ').toLowerCase().includes(query);
        });
        $('summary').textContent = `${rows.length} عملیات از ${state.operations.length} عملیات نمایش داده می‌شود.`;
        $('operations').innerHTML = rows.map((op) => `<tr><td class="method"><code>${escapeHtml(op.method)}</code></td><td><code>${escapeHtml(op.path)}</code></td><td><code>${escapeHtml(op.operationId)}</code></td><td>${escapeHtml(op.surface)}<br><span class="muted">${escapeHtml(op.contractStatus || 'inventory_derived')}</span></td></tr>`).join('') || '<tr><td colspan="4" class="muted">موردی پیدا نشد.</td></tr>';
      };
      const load = async () => {
        status('در حال بارگذاری قرارداد…');
        try {
          const response = await fetch('/api/control/openapi.json', { credentials: 'same-origin', headers: { Accept: 'application/json' } });
          const payload = await response.json();
          if (!response.ok || !payload.success || !payload.data) throw new Error(payload.error?.message || `HTTP ${response.status}`);
          state.document = payload.data;
          state.operations = Object.entries(payload.data.paths || {}).flatMap(([path, item]) => Object.entries(item).filter(([method]) => ['get', 'post', 'put', 'patch', 'delete', 'options', 'head', 'trace'].includes(method)).map(([method, op]) => ({ method: method.toUpperCase(), path, ...op })));
          status(`قرارداد بارگذاری شد: ${payload.data.info?.['x-neem-contract-status'] || 'unknown'}`);
          render();
        } catch (error) {
          state.operations = [];
          $('summary').textContent = '';
          $('operations').innerHTML = '<tr><td colspan="4" class="muted">برای مشاهدهٔ قرارداد، نشست خواندنی پلتفرم لازم است.</td></tr>';
          status(`قرارداد در دسترس نیست: ${error.message}`, true);
        }
      };
      $('search').addEventListener('input', render);
      $('surface').addEventListener('change', render);
      $('reload').addEventListener('click', load);
      load();
    })();
  </script>
</body>
</html>
