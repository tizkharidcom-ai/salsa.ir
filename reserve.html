  <script>
    (function () {
      try {
        var pref = localStorage.getItem('westo_theme');
        if (pref !== 'light' && pref !== 'dark' && pref !== 'system') pref = 'system';
        var t = pref === 'system'
          ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
          : pref;
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.setAttribute('data-theme-pref', pref);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.documentElement.setAttribute('data-theme-pref', 'system');
      }
    })();
  </script>

  <style>
    .reserve-wrap { max-width: 520px; margin: 0 auto; padding: 2rem 1.1rem 3rem; }
    .reserve-brand { text-align: center; margin-bottom: 1.5rem; }
    .reserve-brand img { height: 36px; }
    .reserve-brand h1 { margin: 0.85rem 0 0.35rem; font-size: 1.45rem; }
    .reserve-brand p { margin: 0; color: var(--p-text-dim, #9a958c); font-size: 0.9rem; }
    .slot-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(4.5rem, 1fr));
      gap: 0.45rem;
      margin-top: 0.5rem;
    }
    .slot-btn {
      appearance: none;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.13);
      background: var(--wg-chip-bg, rgba(255, 255, 255, 0.08));
      color: var(--wg-ink, #f4efe6);
      border-radius: var(--wg-r-btn, 0.8rem);
      padding: 0.55rem 0.25rem;
      font: inherit;
      font-size: 0.85rem;
      font-weight: 650;
      cursor: pointer;
      direction: ltr;
      -webkit-backdrop-filter: blur(var(--wg-blur, 12px));
      backdrop-filter: blur(var(--wg-blur, 12px));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2);
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }
    .slot-btn.is-on {
      background: var(--wg-chip-bg-hover, rgba(255, 255, 255, 0.2));
      color: #fff;
      border-color: rgba(120, 208, 216, 0.5);
      transform: translateY(-1px);
    }
    html[data-theme='light'] .slot-btn {
      color: #1a1714;
      border-color: rgba(26, 23, 20, 0.14);
      background: rgba(255, 255, 255, 0.75);
    }
    html[data-theme='light'] .slot-btn.is-on {
      background: var(--wg-cta-bg, #1a1714);
      color: var(--wg-cta-ink, #f7f2ea);
      border-color: transparent;
    }
    html[data-theme='light'] .reserve-done {
      background: var(--wg-panel-bg, #fffcf7);
      border-color: rgba(26, 23, 20, 0.12);
      color: #1a1714;
    }
    /* Pass3 stage7 */
    html[data-theme='light'] .slot-btn:hover:not(:disabled):not(.is-on) {
      background: rgba(26, 23, 20, 0.08);
      border-color: rgba(26, 23, 20, 0.2);
    }
    html[data-theme='light'] .reserve-brand p,
    html[data-theme='light'] #sub {
      color: rgba(26, 23, 20, 0.58);
    }

    .slot-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
    .reserve-done {
      text-align: center;
      padding: 1.5rem 1rem;
      border-radius: var(--wg-r-panel, 1.35rem);
      background:
        linear-gradient(
          155deg,
          rgba(255, 255, 255, 0.12) 0%,
          rgba(14, 12, 11, 0.55) 100%
        );
      border: 1px solid rgba(255, 255, 255, 0.14);
      -webkit-backdrop-filter: blur(var(--wg-blur-panel, 18px));
      backdrop-filter: blur(var(--wg-blur-panel, 18px));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18);
    }
    .reserve-done .code { font-size: 1.6rem; font-weight: 800; direction: ltr; margin: 0.5rem 0; }
  </style>

<body class="panel-body">
  <main class="reserve-wrap" id="main-content" tabindex="-1">
    <div class="reserve-brand">
      <a href="/"><img src="assets/images/brand/westo-wordmark.png?v=brandCyan2" alt="WESTO" width="768" height="431" /></a>
      <h1 data-i18n="reserve.title">رزرو میز</h1>
      <p id="sub" data-i18n="reserve.subtitle">زمان و تعداد نفرات را انتخاب کنید</p>
    </div>

    <div id="form-box" class="section-box" style="margin:0;">
      <div class="field">
        <label for="branch" data-i18n="reserve.branch">شعبه</label>
        <select id="branch"></select>
      </div>
      <div class="grid-2">
        <div class="field">
          <label for="date" data-i18n="reserve.date">تاریخ</label>
          <input id="date" type="date" class="ltr-input" dir="ltr" />
        </div>
        <div class="field">
          <label for="party" data-i18n="reserve.party">تعداد نفرات</label>
          <input id="party" type="number" min="1" max="12" value="2" class="ltr-input" dir="ltr" />
        </div>
      </div>
      <div class="field">
        <span id="reserve-time-label" class="field-group-label" data-i18n="reserve.time">ساعت</span>
        <div id="slots" class="slot-grid" role="group" aria-labelledby="reserve-time-label"><span class="hint" data-i18n="reserve.chooseDate">تاریخ را انتخاب کنید</span></div>
      </div>
      <div class="field">
        <label for="name" data-i18n="reserve.name">نام</label>
        <input id="name" autocomplete="name" />
      </div>
      <div class="field">
        <label for="phone" data-i18n="reserve.phone">موبایل</label>
        <input id="phone" autocomplete="tel" dir="ltr" type="tel" inputmode="numeric" maxlength="11" placeholder="09xxxxxxxxx" />
      </div>
      <div class="field">
        <label for="note" data-i18n="reserve.note">یادداشت (اختیاری)</label>
        <textarea id="note" rows="2" data-i18n-placeholder="reserve.notePh" placeholder="مثلاً تولد، صندلی کودک…"></textarea>
      </div>
      <button class="btn" id="submit" data-i18n="reserve.submit" type="button">ثبت رزرو</button>
      <p id="msg" class="msg" role="status" aria-live="polite" aria-atomic="true"></p>
      <p class="hint" style="margin-top:1rem;"><a href="/" data-i18n="reserve.backSite">بازگشت به سایت</a></p>
    </div>

    <div id="done-box" class="reserve-done" hidden>
      <div data-i18n="reserve.done">رزرو ثبت شد</div>
      <div class="code" id="done-code">#—</div>
      <p id="done-meta" class="hint"></p>
      <p class="hint" data-i18n="reserve.pending">وضعیت: در انتظار تأیید مجموعه</p>
      <a class="btn btn-sm" href="/" style="display:inline-block;width:auto;margin-top:1rem;text-decoration:none;" data-i18n="reserve.back">بازگشت</a>
    </div>
  </main>

  <script src="js/i18n.js?v=logic10-persian2"></script>
  <script>
    (() => {
      'use strict';

      const $ = (id) => document.getElementById(id);
      const tr = (key, vars) => window.westoI18n?.t?.(key, vars) || key;
      const localName = (obj) => window.westoI18n?.pickLocalized?.(obj, 'name', 'nameEn', 'nameAr') || String(obj?.name || '');
      document.title = tr('reserve.documentTitle');

      let selectedTime = '';
      let selectedSlotButton = null;
      let meta = null;

      let metaController = null;
      let slotsController = null;
      let metaGeneration = 0;
      let slotsGeneration = 0;
      let slotRefreshTimer = 0;
      let pageSuspended = false;
      let reservationCompleted = false;

      function abortController(controller) {
        if (!controller) return;
        try {
          controller.abort();
        } catch (_) {}
      }

      function createController(owner) {
        abortController(owner === 'meta' ? metaController : slotsController);
        const controller = new AbortController();
        if (owner === 'meta') metaController = controller;
        else slotsController = controller;
        return controller;
      }

      function localDateISO(date = new Date()) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
      }

      function addDays(iso, count) {
        const parts = String(iso || '').split('-').map(Number);
        if (parts.length !== 3 || parts.some((n) => !Number.isFinite(n))) {
          return localDateISO();
        }

        const date = new Date(parts[0], parts[1] - 1, parts[2], 12, 0, 0, 0);
        date.setDate(date.getDate() + Number(count || 0));
        return localDateISO(date);
      }

      function setMsg(text, ok) {
        const el = $('msg');
        if (!el) return;
        el.textContent = text || '';
        el.className = 'msg' + (text ? (ok ? ' ok' : ' error') : '');
      }

      async function readJsonResponse(response) {
        let data = null;
        try {
          data = await response.json();
        } catch (_) {
          data = null;
        }

        if (!response.ok) {
          const message =
            data && typeof data.error === 'string' && data.error
              ? data.error
              : tr('reserve.serverError');
          throw new Error(message);
        }

        return data || {};
      }

      function currentSlotSignature() {
        return [
          $('branch')?.value || '',
          $('date')?.dataset.isoDate || $('date')?.value || '',
          $('party')?.value || '2',
        ].join('|');
      }

      function clearSelectedSlot() {
        selectedTime = '';
        if (selectedSlotButton?.isConnected) {
          selectedSlotButton.classList.remove('is-on');
        }
        selectedSlotButton = null;
      }

      function setSlotsHint(text) {
        const box = $('slots');
        if (!box) return;
        box.replaceChildren();
        const hint = document.createElement('span');
        hint.className = 'hint';
        hint.textContent = text;
        box.appendChild(hint);
      }

      function renderSlots(slots) {
        const box = $('slots');
        if (!box) return;

        const fragment = document.createDocumentFragment();

        for (const slot of slots) {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'slot-btn';
          button.dataset.time = String(slot.time || '');
          button.disabled = !slot.available;
          button.textContent = String(slot.time || '');
          fragment.appendChild(button);
        }

        box.replaceChildren(fragment);
      }

      function scheduleSlotRefresh(delay = 0) {
        if (reservationCompleted || pageSuspended) return;

        if (slotRefreshTimer) {
          window.clearTimeout(slotRefreshTimer);
          slotRefreshTimer = 0;
        }

        if (delay <= 0) {
          loadSlots();
          return;
        }

        slotRefreshTimer = window.setTimeout(() => {
          slotRefreshTimer = 0;
          loadSlots();
        }, delay);
      }

      async function loadMeta() {
        const generation = ++metaGeneration;
        const controller = createController('meta');

        try {
          const response = await fetch('/api/reservations/meta', {
            credentials: 'same-origin',
            cache: 'no-store',
            signal: controller.signal,
          });
          const nextMeta = await readJsonResponse(response);

          if (
            controller.signal.aborted ||
            generation !== metaGeneration ||
            pageSuspended
          ) {
            return;
          }

          meta = nextMeta;

          if (!meta.enabled) {
            abortController(slotsController);
            clearSelectedSlot();
            $('form-box').innerHTML =
              `<p class="hint">${tr('reserve.disabled')}</p>`;
            return;
          }

          $('sub').textContent =
            tr('reserve.restaurantTitle', { name: localName(meta.restaurant) || 'WESTO' });

          const branchSelect = $('branch');
          const branches = Array.isArray(meta.branches) ? meta.branches : [];
          const fragment = document.createDocumentFragment();

          for (const branch of branches) {
            const option = document.createElement('option');
            option.value = String(branch.id);
            option.textContent = localName(branch);
            fragment.appendChild(option);
          }

          branchSelect.replaceChildren(fragment);

          const params = new URLSearchParams(location.search);
          const requestedBranch = params.get('branch');

          if (requestedBranch) {
            const match = branches.find(
              (branch) =>
                String(branch.id) === requestedBranch ||
                String(branch.slug || '') === requestedBranch
            );
            if (match) branchSelect.value = String(match.id);
          }

          const today = localDateISO();
          const maxAdvance = Math.max(
            1,
            Number(meta.settings?.advanceDays) || 21
          );

          $('date').min = today;
          $('date').max = addDays(today, maxAdvance);

          const existingDate = $('date').dataset.isoDate || $('date').value;
          if (
            !existingDate ||
            existingDate < $('date').min ||
            existingDate > $('date').max
          ) {
            $('date').dataset.isoDate = today;
            if (window.ShamsiCore) {
              $('date').value = window.ShamsiCore.formatShamsiDate(today);
            } else {
              $('date').value = today;
            }
          }

          if (window.ShamsiDatePicker && !$('date')._shamsiPicker) {
            $('date')._shamsiPicker = window.ShamsiDatePicker.attach($('date'), {
              onSelect: () => scheduleSlotRefresh(10),
            });
          }

          $('party').max = String(
            Math.max(1, Number(meta.settings?.maxParty) || 12)
          );

          if (!branches.length) {
            setSlotsHint(tr('reserve.noBranch'));
            return;
          }

          await loadSlots();
        } catch (error) {
          if (error?.name === 'AbortError') return;
          if (generation !== metaGeneration || pageSuspended) return;
          setMsg(error?.message || tr('reserve.loadFail'));
        } finally {
          if (metaController === controller) metaController = null;
        }
      }

      async function loadSlots() {
        if (reservationCompleted || pageSuspended) return;

        clearSelectedSlot();

        const date = window.ShamsiDatePicker?.getISOValue($('date')) || $('date')?.dataset.isoDate || $('date')?.value || '';
        const partySize = $('party')?.value || '2';
        const branchId = $('branch')?.value || '';
        const box = $('slots');

        if (!box) return;
        if (!date || !branchId) {
          setSlotsHint(tr('reserve.chooseDate'));
          return;
        }

        const signature = currentSlotSignature();
        const generation = ++slotsGeneration;
        const controller = createController('slots');

        setSlotsHint('…');

        try {
          const query = new URLSearchParams({
            date,
            partySize,
            branchId,
          });

          const response = await fetch(
            '/api/reservations/slots?' + query.toString(),
            {
              credentials: 'same-origin',
              cache: 'no-store',
              signal: controller.signal,
            }
          );

          const data = await readJsonResponse(response);

          if (
            controller.signal.aborted ||
            generation !== slotsGeneration ||
            signature !== currentSlotSignature() ||
            pageSuspended ||
            reservationCompleted
          ) {
            return;
          }

          if (data.closed) {
            setSlotsHint(tr('reserve.closed'));
            return;
          }

          const slots = Array.isArray(data.slots) ? data.slots : [];
          if (!slots.length) {
            setSlotsHint(tr('reserve.noSlots'));
            return;
          }

          renderSlots(slots);
        } catch (error) {
          if (error?.name === 'AbortError') return;
          if (
            generation !== slotsGeneration ||
            signature !== currentSlotSignature() ||
            pageSuspended
          ) {
            return;
          }
          setSlotsHint(error?.message || tr('reserve.error'));
        } finally {
          if (slotsController === controller) slotsController = null;
        }
      }

      $('slots').addEventListener('click', (event) => {
        const button = event.target.closest('.slot-btn');
        if (!button || button.disabled || !button.dataset.time) return;
        if (!$('slots').contains(button)) return;

        if (selectedSlotButton && selectedSlotButton !== button) {
          selectedSlotButton.classList.remove('is-on');
        }

        selectedSlotButton = button;
        selectedTime = button.dataset.time;
        button.classList.add('is-on');
      });

      $('date').addEventListener('change', () => scheduleSlotRefresh());
      $('party').addEventListener('change', () => scheduleSlotRefresh());
      $('branch').addEventListener('change', () => scheduleSlotRefresh());

      $('submit').addEventListener('click', async () => {
        setMsg('');

        const submitButton = $('submit');
        if (submitButton.disabled || reservationCompleted) return;

        const payload = {
          branchId: Number($('branch').value),
          date: $('date').dataset.isoDate || $('date').value,
          time: selectedTime,
          partySize: Number($('party').value) || 2,
          name: $('name').value.trim(),
          phone: $('phone').value.trim(),
          note: $('note').value.trim(),
        };

        if (!payload.time) {
          setMsg(tr('reserve.chooseTime'));
          return;
        }

        /*
         * Reservation creation is intentionally NOT AbortController/timeout
         * driven. This endpoint is non-idempotent in the current server
         * contract; aborting after the server has committed could encourage a
         * retry and create a duplicate reservation.
         */
        try {
          submitButton.disabled = true;

          const response = await fetch('/api/reservations', {
            method: 'POST',
            credentials: 'same-origin',
            cache: 'no-store',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });

          const data = await readJsonResponse(response);
          const reservation = data.reservation;

          if (!reservation) {
            throw new Error(tr('reserve.invalidResponse'));
          }

          reservationCompleted = true;
          abortController(slotsController);
          slotsController = null;
          clearSelectedSlot();

          $('form-box').hidden = true;
          $('done-box').hidden = false;
          $('done-code').textContent = '#' + reservation.id;
          const displayDate = window.ShamsiCore ? window.ShamsiCore.formatShamsiDateLong(reservation.date) : reservation.date;
          $('done-meta').textContent =
            `${reservation.branchName || ''} · ${displayDate} · ${reservation.time} · ${tr('reserve.people', { n: reservation.partySize })}`;
        } catch (error) {
          setMsg(error?.message || tr('reserve.error'));
        } finally {
          submitButton.disabled = reservationCompleted;
        }
      });

      window.addEventListener('offline', () => {
        if (reservationCompleted) return;
        abortController(slotsController);
        slotsController = null;
        clearSelectedSlot();
        setSlotsHint(tr('reserve.offline'));
      });

      window.addEventListener('online', () => {
        if (!reservationCompleted) scheduleSlotRefresh(120);
      });

      window.addEventListener('pagehide', () => {
        pageSuspended = true;
        ++metaGeneration;
        ++slotsGeneration;

        if (slotRefreshTimer) {
          window.clearTimeout(slotRefreshTimer);
          slotRefreshTimer = 0;
        }

        // Safe GET requests can be aborted. The reservation POST above is not
        // aborted because the server route has no idempotency key contract.
        abortController(metaController);
        abortController(slotsController);
        metaController = null;
        slotsController = null;
      });

      window.addEventListener('pageshow', (event) => {
        if (!event.persisted) return;

        pageSuspended = false;

        if (reservationCompleted || !$('form-box') || $('form-box').hidden) {
          return;
        }

        if (!meta) {
          loadMeta();
        } else {
          scheduleSlotRefresh(80);
        }
      });

      loadMeta();
    })();
  </script>

  
</body>
