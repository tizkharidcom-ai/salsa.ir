# nginx/salsa-vps.conf
# پیکربندی وب‌سرور Nginx برای معماری متمرکز پلتفرم سالسا (SALSA Platform) بر روی یک سرور VPS
# پشتیبانی از دامنه مادر salsa.ir، ساب‌دامین‌های *.salsa.ir و دامنه‌های اختصاصی مشتریان (BYOD)

# ۱. نقشه ارتقای اتصال وب‌سوکت
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# مناطق محدودسازی نرخ درخواست‌ها (DoS & Anti-Brute-Force Rate Limiting)
limit_req_zone $binary_remote_addr zone=salsa_api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=salsa_auth_limit:10m rate=5r/s;

# ==============================================================================
# ۲. دامنه مادر پلتفرم: salsa.ir, admin.salsa.ir
# هدایت پورت ۳۰۵۰ (گادمود) و ۳۰۶۱ (APIهای پلتفرم)
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name salsa.ir www.salsa.ir admin.salsa.ir api.salsa.ir;

    # احراز چالش وب‌روت Let's Encrypt / Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name salsa.ir www.salsa.ir admin.salsa.ir;

    ssl_certificate /etc/letsencrypt/live/salsa.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/salsa.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # هدرهای امنیتی
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # APIهای پلتفرم
    location /api/ {
        proxy_pass http://127.0.0.1:3061;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # وب‌سوکت
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3061;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
    }

    # رابط کاربری گادمود (Godmode UI)
    location / {
        proxy_pass http://127.0.0.1:3050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}

# ==============================================================================
# ۳. ساب‌دامین‌های پیش‌فرض پلتفرم: *.salsa.ir (مانند westo.salsa.ir)
# هدایت به وب‌اپلیکیشن مشتری و پورت ۴۱۸۰
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name *.salsa.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.salsa.ir;

    # گواهی Wildcard پلتفرم سالسا
    ssl_certificate /etc/letsencrypt/live/wildcard.salsa.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wildcard.salsa.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://127.0.0.1:4180;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}

# ==============================================================================
# ۴. دامنه‌های اختصاصی مشتریان (Custom Domain BYOD / White-label)
# مثال: order.shandiz.com, westocoffee.ir
# ==============================================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # چالش احراز خودکار برای دامنه‌های اختصاصی جدید
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;

    # گواهی دامنه‌های اختصاصی (یا استفاده از Caddy با On-Demand TLS به عنوان گزینه پیشنهادی)
    ssl_certificate /etc/letsencrypt/live/custom-domains/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/custom-domains/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # پنهان‌سازی کامل هویت سرور برای وایت‌لیبل ۱۰۰٪
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:4180;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
