# ==============================================================================
# SALSA & WESTO Unified Production Nginx Configuration (Single VPS Deployment)
# ==============================================================================
# Topology:
#   - westo.ir (Port 4180): WESTO Restaurant Web App, POS, Waiter, Kitchen, Menu
#   - salsa.westo.ir (Port 3050): SALSA GODMODE Control Panel
#   - api-control.westo.ir (Port 3061): SALSA Control Plane API
#   - Fallback unified routing on main domain or server IP
# ==============================================================================

upstream westo_runtime {
    server 127.0.0.1:4180;
    keepalive 64;
}

upstream salsa_godmode {
    server 127.0.0.1:3050;
    keepalive 32;
}

upstream salsa_control_plane {
    server 127.0.0.1:3061;
    keepalive 32;
}

# 1. Main Restaurant Domain: westo.ir (Port 4180)
server {
    listen 80;
    listen [::]:80;
    server_name westo.ir www.westo.ir;

    client_max_body_size 25M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpe?g|webp|avif|ico|webmanifest)$ {
        proxy_pass http://westo_runtime;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    location /events {
        proxy_pass http://westo_runtime;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
    }

    location / {
        proxy_pass http://westo_runtime;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_connect_timeout 15s;
    }
}

# 2. SALSA God Mode Control Panel: salsa.westo.ir (Port 3050)
server {
    listen 80;
    listen [::]:80;
    server_name salsa.westo.ir godmode.westo.ir;

    client_max_body_size 10M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location / {
        proxy_pass http://salsa_godmode;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/control/ {
        proxy_pass http://salsa_control_plane/api/control/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 3. SALSA Control Plane API: api-control.westo.ir (Port 3061)
server {
    listen 80;
    listen [::]:80;
    server_name api-control.westo.ir control.westo.ir;

    client_max_body_size 25M;

    location / {
        proxy_pass http://salsa_control_plane;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# 4. Fallback Single-Host or IP Mode (e.g. http://YOUR_VPS_IP/)
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    location / {
        proxy_pass http://westo_runtime;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /godmode/ {
        proxy_pass http://salsa_godmode/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    location /api/control/ {
        proxy_pass http://salsa_control_plane/api/control/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }
}
