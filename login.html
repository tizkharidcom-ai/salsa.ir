<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <link rel="manifest" href="/manifest.webmanifest?v=release14uf1d8-mobile-category-swipe" />
  <script src="/js/pwa-bootstrap.js?v=release14uf1d8-mobile-category-swipe" defer></script>

  <meta charset="utf-8" />
  <title data-i18n="auth.documentTitle">ورود — Westo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover" />
  <script>
    (function () {
      try {
        var pref = localStorage.getItem('westo_theme');
        if (pref !== 'light' && pref !== 'dark' && pref !== 'system') pref = 'system';
        var t = pref === 'system'
          ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
          : pref;
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.setAttribute('data-theme-pref', pref);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.documentElement.setAttribute('data-theme-pref', 'system');
      }
    })();
  </script>
<meta name="theme-color" content="#121416" />


<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png?v=brandCyan2" />
  <link rel="stylesheet" href="css/mobile-forms.css?v=brandCyan2" />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/6a1d9bb2854e5557fe84e7d1_westo-fav-dark.png" />
  <link rel="stylesheet" href="css/westo-glass.css?v=glassAction1" />
  <link rel="stylesheet" href="css/panel.css?v=logic9" />

  <script src="js/theme.js?v=stable1" defer></script>
  <link rel="stylesheet" href="css/vazir-system.css?v=font1" />
  <link rel="stylesheet" href="css/westo-production-v11.css?v=prod11" />
  <link rel="stylesheet" href="css/westo-production-v12.css?v=prod13r9" />
  <script src="js/design-logic-v13.js?v=logic13r1" defer></script>
</head>
<body class="panel-body">
  <main class="auth-wrap" id="main-content" tabindex="-1">
    <h1 class="visually-hidden" data-i18n="auth.login">ورود</h1>
    <div class="auth-card">
      <a href="/"><img class="auth-logo" src="assets/images/brand/westo-wordmark.png?v=brandCyan2" alt="WESTO" width="768" height="431" /></a>

      <!-- Step 1: phone -->
      <div id="step-phone">
        <h2 class="auth-title" data-i18n="auth.login">ورود</h2>
        <p class="auth-sub" data-i18n="auth.phoneIntro">شماره موبایل خود را وارد کنید تا کد تأیید برایتان ارسال شود.</p>
        <div class="field">
          <label for="phone" data-i18n="profile.phone">شماره موبایل</label>
          <input id="phone" dir="ltr" type="tel" inputmode="numeric" maxlength="11" placeholder="09xxxxxxxxx" autocomplete="tel" />
        </div>
        <button id="send-btn" class="btn" data-i18n="auth.sendCode" type="button">دریافت کد تأیید</button>
        <p id="phone-msg" class="msg" role="status" aria-live="polite" aria-atomic="true"></p>
      </div>

      <!-- Step 2: OTP -->
      <div id="step-otp" class="hidden">
        <h2 class="auth-title" data-i18n="auth.otpTitle">کد تأیید</h2>
        <p class="auth-sub"><span data-i18n="auth.otpBefore">کد ۵ رقمی ارسال‌شده به </span><b id="otp-phone" dir="ltr"></b><span data-i18n="auth.otpAfter"> را وارد کنید.</span></p>
        <div id="demo-box" class="demo-code hidden"><span data-i18n="auth.demoBefore">حالت دمو — کد شما: </span><b id="demo-code"></b></div>
        <div class="otp-boxes" id="otp-boxes">
          <input type="text" inputmode="numeric" maxlength="1" aria-label="رقم 1 کد تأیید" autocomplete="one-time-code" />
          <input type="text" inputmode="numeric" maxlength="1" aria-label="رقم 2 کد تأیید" autocomplete="off" />
          <input type="text" inputmode="numeric" maxlength="1" aria-label="رقم 3 کد تأیید" autocomplete="off" />
          <input type="text" inputmode="numeric" maxlength="1" aria-label="رقم 4 کد تأیید" autocomplete="off" />
          <input type="text" inputmode="numeric" maxlength="1" aria-label="رقم 5 کد تأیید" autocomplete="off" />
        </div>
        <button id="verify-btn" class="btn" data-i18n="auth.verify" type="button">ورود</button>
        <p id="otp-msg" class="msg" role="status" aria-live="polite" aria-atomic="true"></p>
        <div class="auth-foot">
          <span id="resend-timer"></span>
          <button type="button" id="resend-link" class="auth-link-btn hidden" data-i18n="auth.resend">ارسال دوباره کد</button>
          &nbsp;·&nbsp;
          <button type="button" id="change-phone" class="auth-link-btn" data-i18n="auth.changePhone">تغییر شماره</button>
        </div>
      </div>

      <div class="auth-foot"><a href="/" data-i18n="auth.backSite">بازگشت به سایت</a></div>
    </div>
  </main>

  <script src="js/i18n.js?v=logic9-fa-default1"></script>
  <script>
    (() => {
      'use strict';

      const $ = (selector) => document.querySelector(selector);
      const tr = (key, vars) => window.westoI18n?.t?.(key, vars) || key;
      document.title = tr('auth.documentTitle');
      const stepPhone = $('#step-phone');
      const stepOtp = $('#step-otp');
      const boxes = Array.from(document.querySelectorAll('#otp-boxes input'));
      const ADMIN_ROLES = new Set([
        'owner',
        'manager',
        'cashier',
        'waiter',
        'kitchen',
        'admin',
      ]);

      let phone = '';
      let resendTimerId = 0;
      let resendDeadline = 0;
      let requestOtpInFlight = false;
      let verifyOtpInFlight = false;
      let authController = null;
      let authGeneration = 0;
      let pageSuspended = false;
      let loginCompleted = false;

      boxes.forEach((box, index) => box.setAttribute('aria-label', tr('auth.otpDigit', { n: index + 1 })));

      function normalizeDigits(value) {
        return String(value || '')
          .replace(/[۰-۹]/g, (digit) => '۰۱۲۳۴۵۶۷۸۹'.indexOf(digit))
          .replace(/[٠-٩]/g, (digit) => '٠١٢٣٤٥٦٧٨٩'.indexOf(digit));
      }

      function normalizedPhoneInput() {
        return normalizeDigits($('#phone').value)
          .replace(/\D/g, '')
          .slice(0, 11);
      }

      function setMsg(selector, text, ok = false) {
        const element = $(selector);
        if (!element) return;
        element.textContent = text || '';
        element.className =
          'msg ' + (text ? (ok ? 'ok' : 'error') : '');
      }

      async function readJson(response) {
        try {
          return await response.json();
        } catch (_) {
          return {};
        }
      }

      function destinationForUser(user) {
        const role = String(user?.role || '').toLowerCase();
        if (role === 'cashier' || role === 'waiter' || role === 'kitchen') return `/admin/${role}`;
        return ADMIN_ROLES.has(role) ? '/admin' : '/profile';
      }

      function stopResendTimer() {
        if (resendTimerId) {
          window.clearInterval(resendTimerId);
          resendTimerId = 0;
        }
      }

      function renderResendTimer() {
        if (!resendDeadline || stepOtp.classList.contains('hidden')) {
          stopResendTimer();
          return;
        }

        const remainingMs = resendDeadline - Date.now();
        const remainingSeconds = Math.max(
          0,
          Math.ceil(remainingMs / 1000),
        );

        if (remainingSeconds <= 0) {
          stopResendTimer();
          $('#resend-timer').textContent = '';
          $('#resend-link').classList.remove('hidden');
          return;
        }

        $('#resend-link').classList.add('hidden');
        $('#resend-timer').textContent =
          tr('auth.resendIn', { n: remainingSeconds });
      }

      function startResendTimer(ms) {
        stopResendTimer();

        const duration = Math.max(0, Number(ms) || 120000);
        resendDeadline = Date.now() + duration;

        renderResendTimer();
        resendTimerId = window.setInterval(renderResendTimer, 1000);
      }

      function showPhoneStep() {
        stepOtp.classList.add('hidden');
        stepPhone.classList.remove('hidden');
        $('#demo-box').classList.add('hidden');
        $('#demo-code').textContent = '';
        setMsg('#otp-msg', '');
        stopResendTimer();
        resendDeadline = 0;
      }

      function showOtpStep(ttlMs, demoCode) {
        $('#otp-phone').textContent = phone;

        if (demoCode) {
          $('#demo-code').textContent = demoCode;
          $('#demo-box').classList.remove('hidden');
        } else {
          $('#demo-code').textContent = '';
          $('#demo-box').classList.add('hidden');
        }

        stepPhone.classList.add('hidden');
        stepOtp.classList.remove('hidden');

        for (const box of boxes) box.value = '';
        boxes[0]?.focus();

        startResendTimer(ttlMs || 120000);
      }

      function clearOtpBoxes() {
        for (const box of boxes) box.value = '';
      }

      function currentOtpCode() {
        return boxes
          .map((box) =>
            normalizeDigits(box.value).replace(/\D/g, '').slice(0, 1)
          )
          .join('');
      }

      async function checkExistingSession() {
        if (pageSuspended || loginCompleted) return;

        const generation = ++authGeneration;
        if (authController) {
          try {
            authController.abort();
          } catch (_) {}
        }

        const controller = new AbortController();
        authController = controller;

        try {
          const response = await fetch('/api/auth/me', {
            credentials: 'same-origin',
            cache: 'no-store',
            signal: controller.signal,
          });

          const data = response.ok ? await readJson(response) : {};

          if (
            controller.signal.aborted ||
            generation !== authGeneration ||
            pageSuspended ||
            loginCompleted
          ) {
            return;
          }

          if (data?.user) {
            loginCompleted = true;
            location.replace(destinationForUser(data.user));
          }
        } catch (error) {
          if (error?.name !== 'AbortError') {
            // Login remains fully usable when session preflight is offline.
          }
        } finally {
          if (authController === controller) authController = null;
        }
      }

      async function requestOtp() {
        if (requestOtpInFlight || loginCompleted) return;

        setMsg('#phone-msg', '');
        setMsg('#otp-msg', '');

        const value = normalizedPhoneInput();
        $('#phone').value = value;

        if (!/^09\d{9}$/.test(value)) {
          setMsg(
            '#phone-msg',
            tr('auth.invalidPhone'),
          );
          return;
        }

        /*
         * OTP issuance is intentionally not AbortController/timeout driven.
         * In a production SMS integration, aborting after the provider accepts
         * the request could encourage a retry and send multiple codes.
         */
        requestOtpInFlight = true;
        $('#send-btn').disabled = true;
        $('#resend-link').classList.add('hidden');

        try {
          const response = await fetch('/api/auth/request-otp', {
            method: 'POST',
            credentials: 'same-origin',
            cache: 'no-store',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone: value }),
          });

          const data = await readJson(response);

          if (!response.ok) {
            const message = data?.error || tr('auth.sendFail');

            if (stepOtp.classList.contains('hidden')) {
              setMsg('#phone-msg', message);
            } else {
              setMsg('#otp-msg', message);
              renderResendTimer();
            }
            return;
          }

          phone = value;
          showOtpStep(
            data?.ttlMs || 120000,
            data?.demo && data?.code ? String(data.code) : '',
          );
        } catch (_) {
          const message =
            tr('auth.networkSend');

          if (stepOtp.classList.contains('hidden')) {
            setMsg('#phone-msg', message);
          } else {
            setMsg('#otp-msg', message);
            renderResendTimer();
          }
        } finally {
          requestOtpInFlight = false;
          $('#send-btn').disabled = false;
        }
      }

      async function verifyOtp() {
        if (verifyOtpInFlight || loginCompleted) return;

        setMsg('#otp-msg', '');

        const code = currentOtpCode();
        if (code.length !== 5) {
          setMsg('#otp-msg', tr('auth.completeOtp'));
          return;
        }

        if (!/^09\d{9}$/.test(phone)) {
          showPhoneStep();
          setMsg('#phone-msg', tr('auth.reenterPhone'));
          return;
        }

        /*
         * Verification mutates the login/session state and may create a new
         * user. Avoid auto-retry/timeout behavior; only dedupe concurrent UI
         * attempts so one code cannot be submitted twice by Enter + auto-fill.
         */
        verifyOtpInFlight = true;
        $('#verify-btn').disabled = true;

        try {
          const response = await fetch('/api/auth/verify-otp', {
            method: 'POST',
            credentials: 'same-origin',
            cache: 'no-store',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone, code }),
          });

          const data = await readJson(response);

          if (!response.ok) {
            setMsg('#otp-msg', data?.error || tr('auth.badCode'));
            return;
          }

          if (!data?.user) {
            setMsg('#otp-msg', tr('auth.badLogin'));
            return;
          }

          loginCompleted = true;
          stopResendTimer();
          setMsg('#otp-msg', tr('auth.success'), true);
          location.replace(destinationForUser(data.user));
        } catch (_) {
          setMsg(
            '#otp-msg',
            tr('auth.networkLogin'),
          );
        } finally {
          verifyOtpInFlight = false;
          if (!loginCompleted) $('#verify-btn').disabled = false;
        }
      }

      $('#send-btn').addEventListener('click', requestOtp);

      $('#phone').addEventListener('keydown', (event) => {
        if (event.key === 'Enter') requestOtp();
      });

      $('#phone').addEventListener('input', () => {
        $('#phone').value = normalizedPhoneInput();
      });

      $('#verify-btn').addEventListener('click', verifyOtp);

      $('#resend-link').addEventListener('click', (event) => {
        event.preventDefault();
        if ($('#resend-link').classList.contains('hidden')) return;
        requestOtp();
      });

      $('#change-phone').addEventListener('click', (event) => {
        event.preventDefault();
        if (requestOtpInFlight || verifyOtpInFlight) return;

        showPhoneStep();
        clearOtpBoxes();
        phone = '';
        $('#phone').focus();
      });

      boxes.forEach((box, index) => {
        box.addEventListener('input', () => {
          box.value = normalizeDigits(box.value)
            .replace(/\D/g, '')
            .slice(0, 1);

          if (box.value && index < boxes.length - 1) {
            boxes[index + 1].focus();
          }

          if (
            !verifyOtpInFlight &&
            boxes.every((candidate) => candidate.value)
          ) {
            verifyOtp();
          }
        });

        box.addEventListener('keydown', (event) => {
          if (
            event.key === 'Backspace' &&
            !box.value &&
            index > 0
          ) {
            boxes[index - 1].focus();
          }

          if (event.key === 'Enter') verifyOtp();
        });

        box.addEventListener('paste', (event) => {
          const digits = normalizeDigits(
            event.clipboardData?.getData('text') || '',
          )
            .replace(/\D/g, '')
            .slice(0, 5);

          if (digits.length !== 5) return;

          event.preventDefault();
          boxes.forEach((candidate, position) => {
            candidate.value = digits[position];
          });

          boxes[boxes.length - 1]?.focus();
          verifyOtp();
        });
      });

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') return;
        if (!stepOtp.classList.contains('hidden')) renderResendTimer();
      });

      window.addEventListener('offline', () => {
        if (authController) {
          try {
            authController.abort();
          } catch (_) {}
          authController = null;
        }
      });

      window.addEventListener('online', () => {
        if (!pageSuspended && !loginCompleted) checkExistingSession();
      });

      window.addEventListener('pagehide', () => {
        pageSuspended = true;
        ++authGeneration;
        stopResendTimer();

        if (authController) {
          try {
            authController.abort();
          } catch (_) {}
          authController = null;
        }
      });

      window.addEventListener('pageshow', (event) => {
        if (!event.persisted) return;

        pageSuspended = false;

        if (!stepOtp.classList.contains('hidden') && resendDeadline) {
          renderResendTimer();
          if (
            resendDeadline > Date.now() &&
            !resendTimerId
          ) {
            resendTimerId = window.setInterval(renderResendTimer, 1000);
          }
        }

        if (!loginCompleted) checkExistingSession();
      });

      checkExistingSession();
    })();
  </script>

  
</body>
</html>
